<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #f8fafc;
    }
    .card-meta {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #64748b;
    }

    /* Dynamic CSS Keyframe Animations */
    @keyframes pulseGlow {
      0% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.8; }
      100% { transform: scale(1); opacity: 0.5; }
    }

    @keyframes floatCard1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes floatCard2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes dashCycle {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .anim-glow1 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .anim-glow2 {
      animation: pulseGlow 10s ease-in-out infinite;
      transform-origin: 1000px 250px;
    }
    .anim-card1 {
      animation: floatCard1 5s ease-in-out infinite;
    }
    .anim-card2 {
      animation: floatCard2 6s ease-in-out infinite;
    }
    .anim-dash {
      stroke-dasharray: 6 6;
      animation: dashCycle 3s linear infinite;
    }
    .anim-blink1 { animation: blinkDot 2s ease-in-out infinite; }
    .anim-blink2 { animation: blinkDot 2.5s ease-in-out infinite 0.5s; }
    .anim-blink3 { animation: blinkDot 2.2s ease-in-out infinite 1s; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glow Blobs in the Background (Behind Everything) -->
  <circle cx="180" cy="90" r="140" fill="url(#glowGrad1)" class="anim-glow1" />
  <circle cx="1020" cy="240" r="160" fill="url(#glowGrad2)" class="anim-glow2" />

  <!-- Subtle Blueprint / Data Flow Pattern (Background layer) -->
  <g opacity="0.12">
    <line x1="100" y1="0" x2="100" y2="360" stroke="#6366f1" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="360" stroke="#6366f1" stroke-width="1" />
    <line x1="500" y1="0" x2="500" y2="360" stroke="#6366f1" stroke-width="1" />
    <line x1="700" y1="0" x2="700" y2="360" stroke="#6366f1" stroke-width="1" />
    <line x1="900" y1="0" x2="900" y2="360" stroke="#6366f1" stroke-width="1" />
    <line x1="1100" y1="0" x2="1100" y2="360" stroke="#6366f1" stroke-width="1" />

    <line x1="0" y1="90" x2="1200" y2="90" stroke="#6366f1" stroke-width="1" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#6366f1" stroke-width="1" />
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#6366f1" stroke-width="1" />
  </g>

  <!-- Dynamic Connecting Flow Path (Data pipeline) positioned cleanly on right flank -->
  <g opacity="0.45">
    <path d="M 880 70 C 950 70, 960 180, 1060 180" fill="none" stroke="#6366f1" stroke-width="2" class="anim-dash" />
    <path d="M 910 280 C 970 280, 990 200, 1070 200" fill="none" stroke="#ec4899" stroke-width="2" class="anim-dash" />
  </g>

  <!-- Side Floating Widget: In-App Survey / Micro-Form Preview (Floating right) -->
  <g class="anim-card1" filter="url(#cardShadow)">
    <rect x="880" y="45" width="260" height="115" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="905" cy="70" r="10" fill="#6366f1" />
    <text x="905" y="74" text-anchor="middle" font-size="11" fill="#fff" font-family="sans-serif" font-weight="bold">Q1</text>
    <text x="925" y="69" class="card-title">Customer Feedback</text>
    <text x="925" y="85" class="card-meta">In-app targeted pulse</text>
    <!-- Mini Rating Pills -->
    <rect x="905" y="100" width="36" height="22" rx="6" fill="#334155" />
    <text x="923" y="115" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="sans-serif">★ 1</text>
    <rect x="947" y="100" width="36" height="22" rx="6" fill="#334155" />
    <text x="965" y="115" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="sans-serif">★ 2</text>
    <rect x="989" y="100" width="36" height="22" rx="6" fill="#334155" />
    <text x="1007" y="115" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="sans-serif">★ 3</text>
    <rect x="1031" y="100" width="36" height="22" rx="6" fill="#4f46e5" />
    <text x="1049" y="115" text-anchor="middle" font-size="10" fill="#ffffff" font-family="sans-serif">★ 4</text>
    <rect x="1073" y="100" width="36" height="22" rx="6" fill="#6366f1" />
    <text x="1091" y="115" text-anchor="middle" font-size="10" fill="#ffffff" font-family="sans-serif">★ 5</text>
  </g>

  <!-- Side Floating Widget: Logic & Response Pipeline Widget -->
  <g class="anim-card2" filter="url(#cardShadow)">
    <rect x="920" y="185" width="240" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="935" y="202" width="8" height="8" rx="2" fill="#10b981" class="anim-blink1" />
    <text x="952" y="210" class="card-title">Conditional Pipeline</text>
    <text x="952" y="226" class="card-meta">If response &gt;= 4 → Post to CRM</text>
    <line x1="935" y1="242" x2="1140" y2="242" stroke="#334155" stroke-width="1" />
    <circle cx="945" cy="265" r="4" fill="#3b82f6" class="anim-blink2" />
    <text x="958" y="268" font-size="11" fill="#cbd5e1" font-family="sans-serif">Webhooks • End-to-End E2EE</text>
    <circle cx="945" cy="285" r="4" fill="#ec4899" class="anim-blink3" />
    <text x="958" y="288" font-size="11" fill="#cbd5e1" font-family="sans-serif">Typeform UI • Formbricks XM</text>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)" />

  <!-- FOREGROUND HERO CONTENT (Ensured 100% foreground visibility and zero overlap) -->
  <g transform="translate(80, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 48)">
      <rect width="260" height="30" rx="15" fill="url(#pillGrad)" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="15" r="5" fill="#10b981" class="anim-blink1" />
      <text x="30" y="20" class="badge-text">📋 CURATED ECOSYSTEM GUIDE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title-text">
      Online Form Builder &amp; Data Collection
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="172" class="subtitle-text">
      Production-grade SaaS platforms, self-hosted open-source alternatives,
    </text>
    <text x="0" y="196" class="subtitle-text">
      conversational UI builders, and developer-first schema engines.
    </text>

    <!-- Feature Pillars / Badges in Foreground -->
    <g transform="translate(0, 240)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="27" font-size="16">⚡</text>
        <text x="42" y="22" font-family="sans-serif" font-weight="600" font-size="13" fill="#f8fafc">Conversational</text>
        <text x="42" y="36" font-family="sans-serif" font-size="11" fill="#94a3b8">Typeform &amp; HeyForm</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(196, 0)">
        <rect width="180" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="27" font-size="16">🛡️</text>
        <text x="42" y="22" font-family="sans-serif" font-weight="600" font-size="13" fill="#f8fafc">Self-Hosted / XM</text>
        <text x="42" y="36" font-family="sans-serif" font-size="11" fill="#94a3b8">Formbricks &amp; Privacy</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(392, 0)">
        <rect width="180" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="27" font-size="16">🧩</text>
        <text x="42" y="22" font-family="sans-serif" font-weight="600" font-size="13" fill="#f8fafc">Developer SDKs</text>
        <text x="42" y="36" font-family="sans-serif" font-size="11" fill="#94a3b8">SurveyJS &amp; Schema</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(588, 0)">
        <rect width="165" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="27" font-size="16">📊</text>
        <text x="42" y="22" font-family="sans-serif" font-weight="600" font-size="13" fill="#f8fafc">Enterprise SaaS</text>
        <text x="42" y="36" font-family="sans-serif" font-size="11" fill="#94a3b8">Jotform &amp; Google</text>
      </g>
    </g>
  </g>
</svg>
